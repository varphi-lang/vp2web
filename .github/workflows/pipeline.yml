name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build, Publish to PyPI & Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'b') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
          make_latest: ${{ !(contains(github.ref, 'b') || contains(github.ref, 'alpha') || contains(github.ref, 'rc')) }}